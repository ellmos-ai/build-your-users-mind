name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pytest
      - name: Bytecode compilation check
        run: python -m compileall -q scripts tests examples
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Pytest test suite
        run: pytest -v
      - name: Run Unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Validate manifest and schemas
        run: python -c "import json; json.load(open('ellmos-module.v2.json', encoding='utf-8')); json.load(open('schemas/classification.schema.json', encoding='utf-8'))"
